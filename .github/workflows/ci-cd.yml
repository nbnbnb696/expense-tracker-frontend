name: expense-tracker-frontend

on:
  push:
    branches:
      - dev
      - qa
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy (manual runs only)
        required: true
        type: choice
        options: [dev, qa, prod]
        default: dev

env:
  IMAGE_NAME: somanathmuduli03/expensetracker-frontend

permissions:
  contents: write

jobs:
  deploy-dev:
    if: github.ref_name == 'dev' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          echo "ENV=dev" >> $GITHUB_ENV
          echo "IMAGE_TAG=dev-v.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build (dev config)
        run: npm run build:dev

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: true
          build-args: |
            APP_ENV=dev
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.ENV }}-latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: rg-apet
          cluster-name: aks-apet
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Create dockerhub secret
        run: |
          kubectl create secret docker-registry dockerhub-secret \
            --docker-username=${{ secrets.DOCKERHUB_USERNAME }} \
            --docker-password=${{ secrets.DOCKERHUB_TOKEN }} \
            --docker-server=https://index.docker.io/v1/ \
            -n dev \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        run: |
          helm upgrade --install expense-tracker-frontend ./helm/expense-tracker-frontend \
            -f ./helm/expense-tracker-frontend/values-dev.yaml \
            --set image.tag=${{ env.IMAGE_TAG }} \
            -n dev --create-namespace \
            --wait

      - name: Update image tag in values-dev.yaml
        run: |
          sed -i 's/^  tag: .*/  tag: "${{ env.IMAGE_TAG }}"/' helm/expense-tracker-frontend/values-dev.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/expense-tracker-frontend/values-dev.yaml
          git diff --cached --quiet || git commit -m "chore: bump dev image tag to ${{ env.IMAGE_TAG }} [skip ci]"
          git push origin HEAD:dev

  deploy-qa:
    if: github.ref_name == 'qa' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'qa')
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          echo "ENV=qa" >> $GITHUB_ENV
          echo "IMAGE_TAG=qa-v.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build (qa config)
        run: npm run build:qa

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: true
          build-args: |
            APP_ENV=qa
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.ENV }}-latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: rg-apet
          cluster-name: aks-apet
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Create dockerhub secret
        run: |
          kubectl create secret docker-registry dockerhub-secret \
            --docker-username=${{ secrets.DOCKERHUB_USERNAME }} \
            --docker-password=${{ secrets.DOCKERHUB_TOKEN }} \
            --docker-server=https://index.docker.io/v1/ \
            -n qa \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        run: |
          helm upgrade --install expense-tracker-frontend ./helm/expense-tracker-frontend \
            -f ./helm/expense-tracker-frontend/values-qa.yaml \
            --set image.tag=${{ env.IMAGE_TAG }} \
            -n qa --create-namespace \
            --wait

      - name: Update image tag in values-qa.yaml
        run: |
          sed -i 's/^  tag: .*/  tag: "${{ env.IMAGE_TAG }}"/' helm/expense-tracker-frontend/values-qa.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/expense-tracker-frontend/values-qa.yaml
          git diff --cached --quiet || git commit -m "chore: bump qa image tag to ${{ env.IMAGE_TAG }} [skip ci]"
          git push origin HEAD:qa

  deploy-prod:
    if: github.ref_name == 'main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          echo "ENV=prod" >> $GITHUB_ENV
          echo "IMAGE_TAG=prod-v.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
