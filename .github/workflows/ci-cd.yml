            -n prod \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        run: |
          helm upgrade --install expense-tracker-frontend ./helm/expense-tracker-frontend \
            -f ./helm/expense-tracker-frontend/values-prod.yaml \
            --set image.tag=${{ env.IMAGE_TAG }} \
            -n prod --create-namespace \
            --wait

      - name: Update image tag in values-prod.yaml
        run: |
          sed -i 's/^  tag: .*/  tag: "${{ env.IMAGE_TAG }}"/' helm/expense-tracker-frontend/values-prod.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/expense-tracker-frontend/values-prod.yaml
          git diff --cached --quiet || git commit -m "chore: bump prod image tag to ${{ env.IMAGE_TAG }} [skip ci]"
          git push origin HEAD:main
