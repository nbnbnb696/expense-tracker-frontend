      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build (prod config)
        run: npm run build:prod

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
