apiVersion: v1
kind: Service
metadata:
  name: {{ include "expense-tracker-frontend.fullname" . }}-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "expense-tracker-frontend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "expense-tracker-frontend.selectorLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
